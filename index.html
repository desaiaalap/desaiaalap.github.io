<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aalap Desai – Data Science Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f5f7fa;
      color: #1f2937;
      line-height: 1.6;
    }

    header {
      background-color: #111827;
      color: #fff;
      padding: 2rem 1rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 0.25rem;
    }

    header p {
      font-size: 1rem;
      opacity: 0.8;
    }

    nav {
      margin-top: 1rem;
    }

    nav a {
      color: #9ca3af;
      margin: 0 12px;
      text-decoration: none;
      font-size: 0.95rem;
    }

    nav a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    section {
      max-width: 800px;
      margin: 3rem auto;
      padding: 0 1rem;
    }

    section h2 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #111827;
    }

    .repo-card {
      background: white;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      transition: transform 0.2s;
    }

    .repo-card:hover {
      transform: scale(1.01);
    }

    .repo-card a {
      text-decoration: none;
      color: #2563eb;
      font-weight: 600;
    }

    .repo-card p {
      margin-top: 0.25rem;
      color: #4b5563;
    }

    .cta-btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 10px 20px;
      background-color: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .cta-btn:hover {
      background-color: #1d4ed8;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.9rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <header>
    <h1>Aalap Desai</h1>
    <p>Data Scientist | Machine Learning | MLOps</p>
    <nav>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
      <a href="https://aalapdesai6.wixsite.com/the-curious-coder" target="_blank">Sports Portfolio</a>
    </nav>
  </header>

  <section id="projects">
    <h2>My GitHub Repositories</h2>
    <div id="repo-list">
      <p>Loading projects...</p>
    </div>
    <a href="https://aalapdesai6.wixsite.com/the-curious-coder" class="cta-btn" target="_blank">View My Sports Analytics Projects</a>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Email: <a href="mailto:desai.aal@northeastern.edu">desai.aal@northeastern.edu</a></p>
    <p><a href="https://linkedin.com/in/aalapdesai" target="_blank">LinkedIn</a> | <a href="https://github.com/desaiaalap" target="_blank">GitHub</a></p>
  </section>

  <footer>
    <p>© 2025 Aalap Desai. All rights reserved.</p>
  </footer>

  <script>
    const INCLUDED_REPOS = [
      "mailmate-nlp-pipeline",
      "bankruptcy-prediction",
      "telco-churn-segmentation",
      "eda-covid19",
      "marketing-campaign-analysis"
    ];

    fetch('https://api.github.com/users/desaiaalap/repos?sort=updated')
      .then(response => response.json())
      .then(repos => {
        const container = document.getElementById('repo-list');
        container.innerHTML = '';
        repos
          .filter(repo => INCLUDED_REPOS.includes(repo.name))
          .forEach(repo => {
            const div = document.createElement('div');
            div.className = 'repo-card';
            div.innerHTML = `
              <a href="${repo.html_url}" target="_blank">${repo.name}</a>
              <p>${repo.description || "No description provided."}</p>
            `;
            container.appendChild(div);
          });

        if (container.innerHTML.trim() === '') {
          container.innerHTML = '<p>No repositories to display.</p>';
        }
      })
      .catch(error => {
        document.getElementById('repo-list').innerHTML = '<p>Error loading repositories.</p>';
        console.error('GitHub API error:', error);
      });
  </script>
</body>
</html>
