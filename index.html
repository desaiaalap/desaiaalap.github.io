<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aalap Desai – Data Science Portfolio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      color: #333;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 2rem;
      text-align: center;
    }

    nav a {
      color: #e5e7eb;
      margin: 0 15px;
      text-decoration: none;
    }

    nav a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    section {
      padding: 2rem;
      max-width: 800px;
      margin: auto;
    }

    ul.repo-list {
      list-style: none;
      padding-left: 0;
    }

    ul.repo-list li {
      background: #ffffff;
      margin: 10px 0;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    button {
      background-color: #2563eb;
      color: white;
      padding: 10px 20px;
      border: none;
      margin-top: 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #1e40af;
    }

    footer {
      background: #e5e7eb;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Aalap Desai</h1>
    <p>Data Scientist | Machine Learning | MLOps</p>
    <nav>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
      <a href="https://aalapdesai6.wixsite.com/the-curious-coder" target="_blank">
        Sports Portfolio
      </a>
    </nav>
  </header>

  <section id="projects">
    <h2>My GitHub Repositories</h2>
    <ul class="repo-list" id="repo-list">
      <li>Loading repositories...</li>
    </ul>
    <a href="https://aalapdesai6.wixsite.com/the-curious-coder" target="_blank">
      <button>View My Sports Analytics Projects</button>
    </a>
  </section>

  <section id="contact">
    <h2>Contact</h2>
    <p>Email: <a href="mailto:desai.aal@northeastern.edu">desai.aal@northeastern.edu</a></p>
    <p>
      <a href="https://linkedin.com/in/aalapdesai" target="_blank">LinkedIn</a> |
      <a href="https://github.com/desaiaalap" target="_blank">GitHub</a>
    </p>
  </section>

  <footer>
    <p>© 2025 Aalap Desai. All rights reserved.</p>
  </footer>

  <script>
  const EXCLUDED_REPOS = [
    "f1-strategy-optimizer", 
    "cricket-performance-analysis", 
    "fitness-analytics-dashboard"
    // Add any other sports repo names here exactly as they appear on GitHub
  ];

  fetch('https://api.github.com/users/desaiaalap/repos?sort=updated')
    .then(response => response.json())
    .then(repos => {
      const repoList = document.getElementById('repo-list');
      repoList.innerHTML = '';
      repos
        .filter(repo => !EXCLUDED_REPOS.includes(repo.name))
        .forEach(repo => {
          const li = document.createElement('li');
          li.innerHTML = `<strong><a href="${repo.html_url}" target="_blank">${repo.name}</a></strong><br>${repo.description || ''}`;
          repoList.appendChild(li);
        });

      if (repoList.innerHTML.trim() === '') {
        repoList.innerHTML = '<li>No repositories to display.</li>';
      }
    })
    .catch(error => {
      document.getElementById('repo-list').innerHTML = '<li>Error loading repositories.</li>';
      console.error('GitHub API error:', error);
    });
</script>

</body>
</html>
